<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Emails</title>
    <style>
        .email-container {
            margin: 20px auto;
            max-width: 800px;
            font-family: Arial, sans-serif;
        }
        .email {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .home-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            text-align: center;
            cursor: pointer;
        }
        .home-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h1>Recent Emails</h1>
        <div id="emails">
            <!-- Emails will be dynamically inserted here -->
            {{ emails|safe }}
        </div>
        <a href="/" class="home-button">Return to Home</a>
    </div>
</body>
</html>
