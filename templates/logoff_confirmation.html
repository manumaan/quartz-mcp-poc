<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Off</title>
    <style>
        .logoff-container {
            text-align: center;
            margin-top: 50px;
        }
        .logoff-message {
            font-size: 1.2em;
            color: #333;
        }
        .login-again-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        .login-again-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="logoff-container">
        <p class="logoff-message">You have been successfully logged off.</p>
        <a href="/login" class="login-again-button">Login Again</a>
    </div>
</body>
</html>
